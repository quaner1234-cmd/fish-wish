<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050403" />
    <meta name="description" content="An interactive story about a painted basin and a child's burial jar, Banpo, about 6,000 years ago." />
    <title>%TITLE%</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage" tabindex="0" role="application" aria-label="The story. Move the light with the arrow keys, hold Space to brush, press Enter to go on.">
      <canvas id="world" aria-hidden="true"></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>
    </div>

    <p id="narration" class="narration" aria-live="polite"></p>
    <p id="hint" class="hint" aria-live="polite"></p>

    <div id="controls" class="controls" hidden>
      <button id="btn-mute" type="button" aria-pressed="false"></button>
      <button id="btn-pause" type="button"></button>
      <button id="btn-skip" type="button"></button>
    </div>

    <section id="start" class="screen" aria-labelledby="start-title">
      <h1 id="start-title"></h1>
      <p id="start-sub" class="sub"></p>
      <p id="start-note" class="note"></p>
      <p id="start-sound" class="note"></p>
      <p id="start-controls" class="note"></p>
      <button id="btn-start" type="button" class="primary"></button>
    </section>

    <section id="paused" class="screen dim" hidden aria-live="polite">
      <p id="paused-text"></p>
      <button id="btn-resume" type="button" class="primary"></button>
    </section>

    <section id="end" class="screen clear" hidden>
      <button id="btn-again" type="button" class="primary"></button>
      <button id="btn-sources" type="button"></button>
    </section>

    <section id="sources" class="screen dim scroll" hidden aria-labelledby="sources-title" role="dialog" aria-modal="true">
      <div class="sheet">
        <h2 id="sources-title"></h2>
        <div id="sources-body"></div>
        <button id="btn-sources-close" type="button" class="primary"></button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
