<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050403" />
    <meta name="robots" content="noindex" />
    <title>Act 4 in 3D (prototype) - %TITLE%</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #tag { position: fixed; left: 12px; top: 10px; z-index: 5; font-size: 13px; color: var(--dim); opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="view" aria-hidden="true"></canvas>
    <p id="tag">Prototype · act 4 in 3D</p>
    <p id="narration" class="narration" aria-live="polite"></p>
    <p id="hint" class="hint" aria-live="polite"></p>
    <section id="start" class="screen" aria-label="Start">
      <h1>Act 4 in 3D</h1>
      <p class="sub">A prototype of the house at dawn, for comparison with the 2D version.</p>
      <button id="btn-play" type="button" class="primary">Play</button>
    </section>
    <script type="module" src="/src/proto-act4.ts"></script>
  </body>
</html>
